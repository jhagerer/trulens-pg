[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "trulens-pg"
dynamic = ["version"]
description = "Postgres-compatible TruLens evaluation and benchmark management"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
authors = [{ name = "Johann Hagerer" }]
keywords = ["trulens", "postgres", "rag", "evaluation", "benchmark", "llm-judge"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  # Narrow pin: PgRunDao and attach() depend on TruLens internals (spec section 8).
  "trulens-core>=2.16,<2.17",
  "trulens-feedback>=2.16,<2.17",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "pandas>=2.0",
  "alembic>=1.13",
  "pydantic>=2",
]

[project.optional-dependencies]
app = ["streamlit[auth]>=1.42", "altair>=5"]
openai = ["trulens-providers-openai>=2.16,<2.17"]
litellm = ["trulens-providers-litellm>=2.16,<2.17"]
snowflake = ["snowflake-connector-python[pandas]>=3.10"]
hf = ["datasets>=2.19"]
parquet = ["pyarrow>=15"]
psycopg2 = ["psycopg2-binary>=2.9"]

[project.scripts]
trulens-pg = "trulens_pg.cli:main"

[project.entry-points."trulens_pg.metrics"]
# Allow-list for python_ref metrics. Other installed packages add their own entries.
contains_policy_number = "trulens_pg.metrics.examples:contains_policy_number"
answer_length_ok = "trulens_pg.metrics.examples:answer_length_ok"

[project.urls]
Homepage = "https://github.com/jhagerer/trulens-pg"
Issues = "https://github.com/jhagerer/trulens-pg/issues"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.8",
  "mypy>=1.13",
  "pre-commit>=4",
  "pandas-stubs>=2.2",
  "pyarrow>=15",
  "streamlit[auth]>=1.42",
  "altair>=5",
]

[tool.hatch.version]
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/trulens_pg/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/trulens_pg"]

[tool.hatch.build.targets.sdist]
include = ["src/trulens_pg", "README.md", "LICENSE", "examples"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["src/trulens_pg/_version.py"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "C4", "PT", "RET", "PL", "S", "TID", "PTH",
]
ignore = [
  "PLR0913",  # many keyword arguments mirror the TruLens API
  "PLR2004",  # magic values in tests and score ranges
  "PLR0911",
  "PLR0912",
  "PLR0915",
  "S101",     # assert in tests
  "S608",     # false positives: SQL is built with SQLAlchemy, not strings
  "PLC0415",  # lazy imports keep optional extras optional
  "RET504",
  "PLR0917",  # positional arguments mirror TruLens method signatures
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "N802"]
"src/trulens_pg/migrations/**" = ["N999"]
"src/trulens_pg/app/pages/**" = ["SIM102"]  # nested st.button blocks read better
"examples/**" = ["S", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["trulens_pg"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["trulens_pg"]
exclude = ["src/trulens_pg/_version\\.py$"]

[[tool.mypy.overrides]]
module = [
  "trulens.*",
  "datasets.*",
  "snowflake.*",
  "altair.*",
  "pyarrow.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# Streamlit page scripts index pandas rows dynamically; they are covered by the
# AppTest smoke tests in tests/integration/test_app.py instead.
module = ["trulens_pg.app.pages.*"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "pg: integration tests that need a Postgres database (TRULENS_PG_TEST_DATABASE_URL)",
  "contract: contract tests against TruLens internals",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["trulens_pg"]
omit = ["src/trulens_pg/_version.py"]
