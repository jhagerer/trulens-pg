name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gitleaks scans the history
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: pre-commit (ruff, mypy, gitleaks, file checks)
        run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        postgres: ["14-alpine", "16-alpine", "17-alpine"]
        exclude:
          - python-version: "3.13"
            postgres: "14-alpine"
          - python-version: "3.13"
            postgres: "17-alpine"
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: trulens_pg_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TRULENS_PG_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/trulens_pg_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --frozen
      - name: Unit and contract tests (no network, no database)
        run: uv run pytest tests/unit -q
      - name: Integration tests (Postgres ${{ matrix.postgres }})
        run: uv run pytest tests/integration -q --cov --cov-report=term-missing

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
      - name: Install the wheel in a clean environment
        run: |
          uv venv /tmp/clean --python 3.12
          VIRTUAL_ENV=/tmp/clean uv pip install dist/*.whl
          /tmp/clean/bin/trulens-pg --help
          /tmp/clean/bin/python -c "import trulens_pg; print(trulens_pg.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
